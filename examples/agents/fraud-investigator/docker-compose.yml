version: "3.9"

# Multi-agent governance demo: orchestrator + risk-scorer + compliance-auditor.
# All three share Qdrant; only the orchestrator actually touches it.
#
# To run:
#   bash scripts/setup-multiagent-demo.sh         # generates .env in this dir
#   docker compose up --build --abort-on-container-exit
#
# Each service loads .env directly via env_file. The agent picks its
# own API key + key id from the per-role variables (ORCH_*, RISK_*,
# COMP_*) inside main.py. This avoids the shell-vs-file precedence
# problem where pre-existing exported variables in the user's shell
# would shadow values in .env during compose interpolation.

x-agent-base: &agent-base
  build: .
  network_mode: host
  depends_on:
    - qdrant
  env_file:
    - .env

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  orchestrator:
    <<: *agent-base
    environment:
      - AGENT_ROLE=orchestrator
      - QDRANT_URL=http://localhost:6333
      - OTEL_SERVICE_NAME=orchestrator

  risk-scorer:
    <<: *agent-base
    environment:
      - AGENT_ROLE=risk-scorer
      - QDRANT_URL=http://localhost:6333
      - OTEL_SERVICE_NAME=risk-scorer

  compliance-auditor:
    <<: *agent-base
    environment:
      - AGENT_ROLE=compliance-auditor
      - QDRANT_URL=http://localhost:6333
      - OTEL_SERVICE_NAME=compliance-auditor

volumes:
  qdrant-data: {}
