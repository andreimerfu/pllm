version: "3.9"

# Single-shot demo stack: Qdrant + the fraud-investigator agent.
# The agent runs once, prints its three steps, then exits.
#
# Required env (export before `docker compose up`):
#   PLLM_BASE_URL  e.g. http://host.docker.internal:8080  (or your minikube ingress)
#   PLLM_API_KEY   the bound key's plaintext value
#   PLLM_KEY_ID    that key's UUID (links OTel spans to the key in pllm)
#
# Both services share the `demo` network so the agent reaches Qdrant by
# its service name. Qdrant data persists across runs in the named volume.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - demo

  agent:
    build: .
    depends_on:
      - qdrant
    # Use the host network so `localhost:8080` reaches whatever is
    # forwarded on the host (e.g. `kubectl port-forward` to minikube).
    # Qdrant publishes :6333 on the host, so agent talks to it via
    # localhost:6333 even though both are technically on different nets.
    network_mode: host
    environment:
      - PLLM_BASE_URL=${PLLM_BASE_URL:-http://localhost:8080}
      - PLLM_API_KEY=${PLLM_API_KEY:?set PLLM_API_KEY in your shell}
      - PLLM_KEY_ID=${PLLM_KEY_ID:?set PLLM_KEY_ID in your shell}
      - ALLOWED_MODEL=${ALLOWED_MODEL:-gpt-4o}
      - DENIED_MODEL=${DENIED_MODEL:-gpt-3.5-turbo}
      - QDRANT_URL=${QDRANT_URL:-http://localhost:6333}
      - OTEL_SERVICE_NAME=fraud-investigator
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/json

networks:
  demo: {}

volumes:
  qdrant-data: {}
